---
name: Bug report
description: Something is broken or unexpected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Include FeastPick version from `GET /api/health` when possible.
  - type: input
    id: version
    attributes:
      label: FeastPick version
      placeholder: "1.0.0"
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See error …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "Browser / OS / Docker version"
      placeholder: "Firefox 130, Linux, Docker 26"
    validations:
      required: false
