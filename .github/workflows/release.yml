name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (e.g. v1.0.0). Leave empty to use the ref name."
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build, push GHCR, GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          # strip leading v for docker tags; keep tag name for GitHub release
          TAG="$RAW"
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *) VERSION="$TAG"; TAG="v$TAG" ;;
          esac
          # Prefer VERSION file if present and matches (warn otherwise)
          if [ -f VERSION ]; then
            FILE_VER=$(tr -d '[:space:]' < VERSION)
            if [ "$FILE_VER" != "$VERSION" ]; then
              echo "::warning::VERSION file ($FILE_VER) != tag version ($VERSION); using tag"
            fi
          fi
          # Official namespace is always letzhub/feastpick
          IMAGE="${{ env.REGISTRY }}/letzhub/feastpick"
          OWNER_LC=letzhub

          # semver parts for floating tags
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor_tag=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG → $IMAGE:$VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=${{ steps.meta.outputs.minor_tag }}
            type=raw,value=${{ steps.meta.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Extract changelog section
        id: notes
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          python3 <<'PY' > /tmp/release-notes.md
          import pathlib, re, sys
          ver = """${{ steps.meta.outputs.version }}"""
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Match ## [1.0.0] - date  until next ## [
          pat = rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          m = re.search(pat, text, flags=re.M | re.S)
          body = m.group(1).strip() if m else f"Release v{ver}. See CHANGELOG.md."
          print(body)
          print()
          print("---")
          print()
          print(f"**Container image**")
          print()
          print(f"```bash")
          print(f"docker pull ${{ steps.meta.outputs.image }}:{ver}")
          print(f"```")
          print()
          print(f"Also tagged: `{ver}`, `${{ steps.meta.outputs.minor_tag }}`, `${{ steps.meta.outputs.major }}`, `latest`.")
          PY
          echo "path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FeastPick ${{ steps.meta.outputs.tag }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
