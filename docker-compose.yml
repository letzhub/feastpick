# FeastPick
#
# Quick start:
#   docker compose up -d --build
#
# App: http://localhost:8080/
# Image: ghcr.io/letzhub/feastpick

name: feastpick

services:
  feastpick:
    image: ghcr.io/letzhub/feastpick:${FEASTPICK_VERSION:-latest}
    build:
      context: .
      args:
        VERSION: ${FEASTPICK_VERSION:-1.1.0}
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-}
    container_name: feastpick
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      FEASTPICK_DATA: /app/data
      FEASTPICK_VERSION: ${FEASTPICK_VERSION:-1.1.0}
      PORT: "8080"
    volumes:
      - feastpick-data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s

volumes:
  feastpick-data:
